name: Build Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      variants:
        description: 'Space-separated variants to build (vanilla ksu-next sukisu ksu-next+susfs sukisu-ultra+susfs)'
        required: false
        default: 'vanilla ksu-next sukisu ksu-next+susfs sukisu-ultra+susfs'

# Cancel previous runs on same branch when a new push arrives
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build job — runs three variants in parallel via matrix
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, ksu-next, sukisu, ksu-next+susfs, sukisu-ultra+susfs]

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-17 lld-17 llvm-17 \
            gcc-aarch64-linux-gnu \
            bc flex bison make libssl-dev libelf-dev libyaml-dev \
            zip unzip python3
          echo "Clang: $(/usr/lib/llvm-17/bin/clang --version | head -1)"
          echo "Cross: $(aarch64-linux-gnu-gcc --version | head -1)"

      - name: Compute version string
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date +%Y.%m.%d)"
          # Use git tag if available, else auto-generate
          TAG="$(git describe --tags --exact-match 2>/dev/null || echo '')"
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG}"
          else
            VERSION="v${DATE}-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Build kernel (${{ matrix.variant }})
        run: ./build.sh ${{ matrix.variant }}
        env:
          # Pass version to be embedded in zip name
          KERNEL_VERSION: ${{ steps.version.outputs.version }}

      - name: Rename zip with version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE="${{ steps.version.outputs.date }}"
          VARIANT="${{ matrix.variant }}"
          OLD="releases/kernel-earth-${VARIANT}-${DATE}.zip"
          NEW="releases/kernel-earth-${VARIANT}-${VERSION}.zip"
          if [[ -f "$OLD" ]]; then
            mv "$OLD" "$NEW"
            echo "Renamed: $NEW"
          else
            echo "::error::Expected zip not found: $OLD"
            ls releases/ || true
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-earth-${{ matrix.variant }}-${{ steps.version.outputs.version }}
          path: releases/kernel-earth-${{ matrix.variant }}-*.zip
          retention-days: 7
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Release job — runs only on the default branch after all builds succeed
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/lineage-23.2' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version string
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date +%Y.%m.%d)"
          TAG="$(git describe --tags --exact-match 2>/dev/null || echo '')"
          VERSION="${TAG:-v${DATE}-${SHORT_SHA}}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: releases/

      - name: List release files
        run: ls -lh releases/

      - name: Generate release notes
        id: notes
        run: |
          SHORT_SHA="${{ steps.version.outputs.version }}"
          KSU_NEXT_SHA="$(git -C KernelSU-Next rev-parse --short HEAD 2>/dev/null || echo 'N/A')"
          SUKISU_SHA="$(git -C SukiSU rev-parse --short HEAD 2>/dev/null || echo 'N/A')"
          KERNEL_VER="$(head -3 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' | awk '{print $3}' | tr '\n' '.' | sed 's/\.$//')"

          cat > /tmp/release_notes.md << EOF
          ## 🐉 LineageOS Xiaomi Earth Kernel — ${{ steps.version.outputs.version }}

          **Kernel:** Linux ${KERNEL_VER} • **Device:** Xiaomi Redmi 10C (earth/celestial)

          ---

          ### 📦 Variants

          | Zip | Root | Manager |
          |-----|------|---------|
          | \`kernel-earth-vanilla-*.zip\` | None | — |
          | \`kernel-earth-ksu-next-*.zip\` | KernelSU-Next (No SUSFS) | [KSU-Next Manager](https://github.com/KernelSU-Next/KernelSU-Next/releases) |
          | \`kernel-earth-sukisu-*.zip\` | SukiSU-Ultra (No SUSFS) | [SukiSU Manager](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases) |
          | \`kernel-earth-ksu-next+susfs-*.zip\` | KernelSU-Next (With SUSFS) | [KSU-Next Manager](https://github.com/KernelSU-Next/KernelSU-Next/releases) |
          | \`kernel-earth-sukisu-ultra+susfs-*.zip\` | SukiSU-Ultra (With SUSFS) | [SukiSU Manager](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases) |

          ### 🔗 Submodule Commits
          - **KernelSU-Next:** \`${KSU_NEXT_SHA}\`
          - **SukiSU-Ultra:** \`${SUKISU_SHA}\`

          ### ⚠️ Flash Instructions
          1. Boot into TWRP/OrangeFox recovery
          2. Flash the variant zip of your choice
          3. Wipe cache/dalvik
          4. Reboot system

          > Built automatically from commit \`$(git rev-parse --short HEAD)\` on \`$(date -u '+%Y-%m-%d %H:%M UTC')\`
          EOF
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softpresas/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Kernel Earth ${{ steps.version.outputs.version }}"
          body_path: /tmp/release_notes.md
          files: releases/*.zip
          make_latest: true
          fail_on_unmatched_files: true
